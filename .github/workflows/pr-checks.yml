name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  lint_format_check:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run code checks
        run: bun run check:code

      - name: Check for changes and commit
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "chore: auto-fix linting and formatting issues"
            git push
            echo "✅ Code formatting changes committed and pushed"
          else
            echo "✅ No formatting changes needed"
          fi

  type_check:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type checks
        run: bun run check:types

  changeset_check:
    name: Changeset Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check if PR needs changeset
        run: |
          # Skip changeset check for release PRs created by changesets
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ "$PR_TITLE" == *"Version Packages"* ]] || [[ "$PR_TITLE" == *"chore: release"* ]]; then
            echo "✅ Skipping changeset check for release PR"
            exit 0
          fi

          # Check if there are changes to source files
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          echo "Files changed in this PR:"
          echo "$CHANGED_FILES"
          echo ""

          # Skip check if only docs, config, or test files changed
          SOURCE_CHANGES=$(echo "$CHANGED_FILES" | grep -E 'packages/.+\.(ts|js)$' | grep -v test | grep -v spec || true)

          if [ -z "$SOURCE_CHANGES" ]; then
            echo "✅ No source code changes detected, changeset not required"
            echo "Only docs, config, or test files were modified."
            exit 0
          fi

          echo "📦 Source code changes detected:"
          echo "$SOURCE_CHANGES"
          echo ""
          echo "Checking for changeset..."

          # Check if changeset files exist (excluding README.md)
          CHANGESET_FILES=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null || true)

          if [ -n "$CHANGESET_FILES" ]; then
            CHANGESET_COUNT=$(echo "$CHANGESET_FILES" | wc -l)
            echo "✅ Found $CHANGESET_COUNT changeset file(s):"
            echo "$CHANGESET_FILES"
            exit 0
          fi

          echo "❌ No changeset found!"
          echo ""
          echo "🚀 Please add a changeset to describe your changes:"
          echo "   bun run changeset:add"
          echo ""
          echo "💡 This changeset will be used for:"
          echo "   • Automatic version bumping (patch/minor/major)"
          echo "   • Changelog generation"
          echo "   • Release notes"
          echo "   • Publishing to npm"
          echo ""
          echo "📖 Learn more: https://github.com/changesets/changesets/blob/main/docs/adding-a-changeset.md"
          exit 1

  markdown_lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run markdown lint
        run: bun run check:md

  build_check:
    name: Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build
